<!DOCTYPE html>
<html>
<head>
  <title>Audio Test</title>
</head>
<body>
  <h1>Audio Test</h1>
  <button id="enableAudio">Enable Audio</button>
  <button id="testClick">Test click.m4a</button>
  <button id="testCorrect">Test correct.m4a</button>
  <button id="testWrong">Test wrong.m4a</button>
  <button id="testWoosh">Test woosh.m4a</button>
  <div id="log"></div>

  <script>
    let audioContext;
    
    function log(message) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += '<div>' + message + '</div>';
      console.log(message);
    }
    
    document.getElementById('enableAudio').onclick = async () => {
      audioContext = new AudioContext();
      log('Audio context created, state: ' + audioContext.state);
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
        log('Audio context resumed, state: ' + audioContext.state);
      }
    };
    
    async function testAudio(filename) {
      if (!audioContext) {
        log('ERROR: Audio context not initialized. Click Enable Audio first.');
        return;
      }
      
      try {
        log(`Fetching ${filename}...`);
        const response = await fetch('/audio/' + filename);
        log(`Fetch response status: ${response.status}`);
        
        const arrayBuffer = await response.arrayBuffer();
        log(`ArrayBuffer size: ${arrayBuffer.byteLength} bytes`);
        
        log('Decoding audio data...');
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        log(`Decoded! Duration: ${audioBuffer.duration}s, Channels: ${audioBuffer.numberOfChannels}, SampleRate: ${audioBuffer.sampleRate}`);
        
        log('Creating source and playing...');
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioContext.destination);
        source.start(0);
        log('Playing!');
        
        source.onended = () => {
          log('Playback ended');
        };
      } catch (error) {
        log('ERROR: ' + error.name + ': ' + error.message);
        console.error(error);
      }
    }
    
    document.getElementById('testClick').onclick = () => testAudio('click.m4a');
    document.getElementById('testCorrect').onclick = () => testAudio('correct.m4a');
    document.getElementById('testWrong').onclick = () => testAudio('wrong.m4a');
    document.getElementById('testWoosh').onclick = () => testAudio('woosh.m4a');
  </script>
</body>
</html>
